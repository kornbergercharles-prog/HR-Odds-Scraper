name: HR Odds Scraper

on:
  workflow_dispatch:
    inputs:
      use_odds_api:
        description: 'Pull fresh FanDuel + Bovada odds via API?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      include_api_in_output:
        description: 'Include saved API odds in this output?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache Playwright
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl playwright beautifulsoup4
          playwright install chromium
      
      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      
      - name: Run DraftKings scraper
        run: xvfb-run -a python scraper_dk.py
      
      - name: Run Odds API scraper (fresh pull)
        if: ${{ github.event.inputs.use_odds_api == 'true' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scraper_api.py
      
      - name: Prepare API data for output (fresh pull)
        if: ${{ github.event.inputs.use_odds_api == 'true' }}
        run: cp odds_api_responses.json odds_api_responses_active.json
      
      - name: Prepare API data for output (use saved)
        if: ${{ github.event.inputs.use_odds_api == 'false' && github.event.inputs.include_api_in_output == 'true' }}
        run: cp odds_api_responses.json odds_api_responses_active.json
      
      - name: Prepare API data for output (DK only)
        if: ${{ github.event.inputs.use_odds_api == 'false' && github.event.inputs.include_api_in_output == 'false' }}
        run: echo "[]" > odds_api_responses_active.json
      
      - name: Run Excel export
        run: python hr_excel.py
      
      - name: Upload Excel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hr_odds.xlsx
          path: hr_odds.xlsx
          compression-level: 0
      
      - name: Commit files to repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hr_odds.xlsx all_responses.json
          git add -f dk_screenshot.png || true
          if [ "${{ github.event.inputs.use_odds_api }}" == "true" ]; then
            git add odds_api_responses.json
          fi
          git commit -m "Update odds files - $(date)" || echo "No changes to commit"
          git push
