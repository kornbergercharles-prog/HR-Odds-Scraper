name: HR Odds Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl playwright beautifulsoup4
          playwright install chromium
      
      - name: Install xvfb (virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      
      - name: Run DraftKings scraper
        run: python scraper_dk.py
      
      - name: Run FanDuel scraper with virtual display
        run: xvfb-run -a python scraper_fanduel.py
      
      - name: Run Excel export
        run: python hr_excel.py
      
      - name: Upload Excel to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hr_odds
          path: hr_odds.xlsx
          retention-days: 30
