name: HR Odds Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache Playwright
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl playwright beautifulsoup4
          playwright install chromium
      
      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      
      - name: Run DraftKings scraper
        run: xvfb-run -a python scraper_dk.py
      
      - name: Run FanDuel scraper
        run: xvfb-run -a python scraper_fanduel.py
      
      - name: Run bet365 scraper
        run: xvfb-run -a python scraper_bet365.py
      
      - name: Run Excel export
        run: python hr_excel.py
      
      - name: Upload Excel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hr_odds.xlsx
          path: hr_odds.xlsx
          compression-level: 0
      
      - name: Commit files to repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add hr_odds.xlsx fanduel_responses.json all_responses.json bet365_responses.json
          git add -f dk_screenshot.png fanduel_screenshot.png bet365_screenshot.png || true
          git commit -m "Update odds files - $(date)" || echo "No changes to commit"
          git push
